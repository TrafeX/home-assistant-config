- sensor:
    - name: "House Energy Consumption"
      state: "{{ [(states('sensor.power_consumption') | float(0.0) + states('sensor.solaredge_i1_ac_power') | float(0.0) - states('sensor.power_production') | float(0.0)) | int,0]|max }}"
      unit_of_measurement: W
      icon: mdi:home-lightning-bolt
      state_class: measurement
      device_class: power
    - name: Nefit Temperature
      unit_of_measurement: °C
      default_entity_id: sensor.nefit_temperature
      state: "{{ state_attr('climate.heating', 'current_temperature') }}"
    - name: Lights that are on
      unit_of_measurement: lights
      default_entity_id: sensor.lights_on
      state: "{{ states.light|selectattr('state', 'equalto', 'on')|list|length }}"
    - name: "UPS Power Usage"
      unique_id: ups_power_usage
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >
        {% set load_percent = states('sensor.ups_load') | float(0) %}
        {% set nominal_power = states('sensor.ups_nominal_output_power') | float(0) %}
        {{ (load_percent / 100 * nominal_power * 1.15) | round(1) }}
      availability: "{{ has_value('sensor.ups_load') }}"
# Latch the last known good external IP, so it survives ipify outages
- trigger:
    - trigger: state
      entity_id: sensor.external_ip
      not_to:
        - unavailable
        - unknown
  sensor:
    - name: External IP Address
      unique_id: external_ip_address
      icon: mdi:wan
      state: "{{ trigger.to_state.state }}"
- binary_sensor:
    - name: Wash dryer running
      default_entity_id: binary_sensor.wash_dryer_running
      state: "{{ states('select.wasdroger') == 'run' }}"
    - name: Washing machine running
      default_entity_id: binary_sensor.washing_machine_running
      state: "{{ states('select.wasmachine') == 'run' }}"
    - name: Wash dryer
      delay_on: 0:01:00
      delay_off: 0:03:00
      default_entity_id: binary_sensor.wash_dryer_state
      state: "{{ states('sensor.washdryer_electric_consumption_w')|int(0) > 4 }}"
    - name: Hot Water
      default_entity_id: binary_sensor.hotwater_active
      state: "{{ state_attr('climate.heating', 'boiler_indicator') == 'HW' }}"
# Generic threshold watchdog. Every rule below is matched against all entities
# of the right device_class, so adding a new alert is one entry in the rules
# list - the notifying automation (automation/sensor_alerts.yaml) is
# rule-agnostic and needs no change.
#
# Trigger-based on purpose: a stateless template that iterates over
# states.sensor re-renders on every state change of every sensor. Once a
# minute is predictable and fast enough for this.
- trigger:
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
    # So a "Template entities" reload gives an answer straight away.
    - trigger: event
      event_type: event_template_reloaded
  action:
    # Computed once here so both the state and the attribute can reuse it,
    # which avoids a self-reference through `this`.
    - variables:
        numeric_rules:
          - id: temp_high
            device_class: temperature
            above: 50
            unit: "°C"
            label: is te heet
            emoji: "🔥"
            icon: mdi:thermometer-alert
            severity: critical
            # Sun-exposed sensors easily read above 50 without anything being
            # wrong. Meterkast, schuur and trapkast stay monitored on purpose:
            # that is exactly where overheating matters.
            exclude_areas: [achtertuin, voortuin, backyard, frontyard]
            exclude:
              - sensor.heating_supply_temperature
              - sensor.raspberry_pi_cpu_temperature
              - sensor.vaatwasser_device_temperature
          - id: humidity_high
            device_class: humidity
            above: 80
            unit: "%"
            label: is te vochtig
            emoji: "💧"
            icon: mdi:water-alert
            severity: warning
            exclude_areas:
              [achtertuin, voortuin, schuur, backyard, frontyard, shed]
            exclude:
              - sensor.netatmo_outdoor_humidity
        protection_words:
          - overheat
          - over_heat
          - overload
          - over_load
          - overcurrent
          - over_current
          - overvoltage
          - over_voltage
        # Add entities here if device_class problem turns out to be noisy.
        protection_exclude: []
        offenders: >
          {% set ns = namespace(found=[]) %}
          {% for rule in numeric_rules %}
            {% for s in states.sensor
                 | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', rule.device_class)
                 | rejectattr('entity_id', 'in', rule.exclude) %}
              {% set aid = (area_id(s.entity_id) or '') | lower %}
              {% set aname = (area_name(s.entity_id) or '') | lower %}
              {% if has_value(s.entity_id)
                    and aid not in rule.exclude_areas
                    and aname not in rule.exclude_areas
                    and s.state | float(rule.above) > rule.above %}
                {% set ns.found = ns.found + [{
                     'key': rule.id ~ '_' ~ s.object_id,
                     'rule': rule.id,
                     'entity_id': s.entity_id,
                     'name': s.name,
                     'area': area_name(s.entity_id) or 'onbekend',
                     'unit': rule.unit,
                     'label': rule.label,
                     'emoji': rule.emoji,
                     'icon': rule.icon,
                     'severity': rule.severity,
                     'threshold': rule.above ~ ' ' ~ rule.unit,
                   }] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% for s in states.binary_sensor
               | selectattr('state', 'eq', 'on')
               | rejectattr('entity_id', 'in', protection_exclude) %}
            {% if protection_words | select('in', s.entity_id) | list | count > 0
                  or s.attributes.get('device_class') == 'problem' %}
              {% set ns.found = ns.found + [{
                   'key': 'device_protection_' ~ s.object_id,
                   'rule': 'device_protection',
                   'entity_id': s.entity_id,
                   'name': s.name,
                   'area': area_name(s.entity_id) or 'onbekend',
                   'unit': '',
                   'label': 'meldt een storing',
                   'emoji': "⚠️",
                   'icon': 'mdi:alert-octagon',
                   'severity': 'critical',
                   'threshold': '',
                 }] %}
            {% endif %}
          {% endfor %}
          {{ ns.found }}
  sensor:
    - name: "Sensor alerts"
      unique_id: sensor_alerts
      icon: mdi:alert-decagram
      state: "{{ offenders | count }}"
      attributes:
        # Deliberately no measured value in here: it would change every minute
        # and churn the recorder while an alert is active. The automation reads
        # the live value with states() when it notifies.
        offenders: "{{ offenders }}"
