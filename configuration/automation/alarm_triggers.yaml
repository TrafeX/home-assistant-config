# Whether a sensor actually triggers the panel is decided by
# script.alarm_sensor_event (a door or window at once, motion only when
# confirmed by a second sensor). Once triggered the panel is 'pending'
# (delay_time) and then 'triggered'. Sensors in those states still count, as
# long as the panel came from the mode of the automation (the manual panel
# keeps it in the 'previous_state' attribute).
#
# The sensor lists must stay in sync with group.alarm_sensors.
- id: trigger_alarm_armed_away
  alias: "Trigger alarm while armed away"
  mode: queued
  trigger:
    - trigger: state
      entity_id:
        - binary_sensor.living_motion_detection
        - binary_sensor.hallway_gf_motion
        - binary_sensor.hallway_1st_motion_detection
        - binary_sensor.hallway_2nd_motion_detection
        - binary_sensor.bedroom_jens_motion_detection
        - binary_sensor.tygo_motion_detection
        - binary_sensor.voordeur_opening
        - binary_sensor.schuifpui_opening
        - binary_sensor.backyard_person
        - binary_sensor.shed_motion
      to: "on"
  condition:
    - alias: Armed away, or already going off from armed away
      condition: template
      value_template: >
        {{ is_state('alarm_control_panel.home_alarm', 'armed_away')
           or (states('alarm_control_panel.home_alarm') in ['pending', 'triggered']
               and is_state_attr('alarm_control_panel.home_alarm',
                                 'previous_state', 'armed_away')) }}
  action: &alarm_trigger_action
    - action: script.alarm_sensor_event
      data:
        sensor: "{{ trigger.entity_id }}"

