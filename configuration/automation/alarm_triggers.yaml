# Deliberately notify only: no siren or lights yet, a motion sensor still
# fires falsely now and then.
- id: notify_of_alarm
  alias: "Notify of alarm"
  trigger:
    - trigger: state
      entity_id: alarm_control_panel.home_alarm
      to: triggered
  action:
    - action: logbook.log
      data:
        name: Alarm
        entity_id: alarm_control_panel.home_alarm
        message: "Alarm afgegaan: niet binnen de vertraging uitgeschakeld"
    - action: notify.app_tim
      data:
        title: "🚨 Inbraakalarm afgegaan!"
        message: >
          Het alarm is niet uitgeschakeld. Sensoren: {{
            states('input_text.alarm_event_sensors').split(',')
            | reject('eq', '') | map('regex_replace', '^', 'binary_sensor.')
            | map('state_attr', 'friendly_name') | join(', ') }}
        data:
          tag: alarm_triggered
          ttl: 0
          priority: high
          importance: high
          channel: Alarm bevestigd
          notification_icon: mdi:shield-alert
          clickAction: /lovelace/security
          actions:
            - action: disarm_alarm
              title: "Uitschakelen"
            - action: alarm_blink_lights
              title: "Lampen knipperen"
            - action: URI
              title: "Camera's"
              uri: /lovelace/security

- id: reset_alarm_verification_window
  alias: "Reset alarm verification window"
  trigger:
    - trigger: state
      entity_id: alarm_control_panel.home_alarm
      to: disarmed
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.alarm_verification
  action:
    - action: timer.cancel
      target:
        entity_id: timer.alarm_verification
    - action: input_text.set_value
      target:
        entity_id: input_text.alarm_event_sensors
      data:
        value: ""
