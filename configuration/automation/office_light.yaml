- id: turn_on_office_lights_when_dark
  alias: "Turn on the office lights when the small office is active and it is dark"
  # There is no illuminance sensor in the small office, so the sun stands in
  # for it. Elevation is used instead of below_horizon because the room is
  # already dark a while before the sun actually sets; lower the threshold if
  # the lights come on too early.
  trigger:
    - trigger: state
      entity_id: input_boolean.small_office_active
      to: "on"
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 3
  condition:
    - condition: state
      entity_id: input_boolean.small_office_active
      state: "on"
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 3
  action:
    - action: light.turn_on
      target:
        entity_id:
          - light.office_led_strip_backside
          - light.small_office_light

- id: turn_off_office_lights
  alias: "Turn off the office lights when the small office becomes inactive or it gets light"
  trigger:
    - trigger: state
      entity_id: input_boolean.small_office_active
      to: "off"
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: 3
  action:
    - action: light.turn_off
      target:
        entity_id:
          - light.office_led_strip_backside
          - light.small_office_light
