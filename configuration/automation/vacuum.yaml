- id: notify_vacuum_cleaner_done
  alias: "Notify when the vacuum robot is done"
  trigger:
    - trigger: state
      id: done
      entity_id: vacuum.xiaomi_vacuum_cleaner
      from: "cleaning"
      not_to:
        - "error"
        - "unavailable"
    # Separate trigger so an error on the way back to the dock (or while
    # paused) is reported too, not only one straight out of cleaning.
    - trigger: state
      id: error
      entity_id: vacuum.xiaomi_vacuum_cleaner
      to: "error"
  condition:
    # The nightly run finishes when everyone is in bed: only an error is
    # worth a notification then.
    - condition: or
      conditions:
        - condition: trigger
          id: error
        - alias: "Home is not in night mode"
          condition: not
          conditions:
            - condition: state
              entity_id: input_select.home_mode
              state: night
  action:
    - if:
        - condition: trigger
          id: error
      then:
        - action: notify.app_tim
          data:
            title: "⚠️ De robotstofzuiger heeft een fout"
            message: >
              De robotstofzuiger is gestopt met een fout en heeft hulp nodig.
            data:
              tag: vacuum_cleaner
              notification_icon: mdi:robot-vacuum-alert
      else:
        - action: notify.app_tim
          data:
            title: "🧹 De robotstofzuiger is klaar"
            message: >
              Tijd: {{ (states('sensor.xiaomi_vacuum_cleaner_last_clean_duration') | int(0) / 60) | round }} min.
              Oppervlakte: {{ states('sensor.xiaomi_vacuum_cleaner_last_clean_area') }} m².
            data:
              tag: vacuum_cleaner
              notification_icon: mdi:robot-vacuum

- id: enable_automatic_vacuum_sleep_mode
  alias: "Enable automatic vacuum cleaner on sleep mode"
  trigger:
    - trigger: state
      entity_id: input_select.home_mode
      to: night
  action:
    - action: input_boolean.turn_on
      entity_id: input_boolean.automatic_vacuum_cleaner

- id: run_vacuum_automatic_enabled
  alias: "Run the vacuum cleaner when automatic vacuum cleaner is enabled"
  trigger:
    - trigger: state
      entity_id: input_boolean.automatic_vacuum_cleaner
      to: "on"
    - trigger: state
      entity_id: vacuum.xiaomi_vacuum_cleaner
      to: "docked"
  condition:
    - condition: state
      entity_id: input_boolean.automatic_vacuum_cleaner
      state: "on"
  action:
    - action: vacuum.start
      entity_id: vacuum.xiaomi_vacuum_cleaner

- id: disable_automatic_vacuum_started_cleaning
  alias: "Disable automatic vacuum cleaner when started cleaning"
  trigger:
    - trigger: state
      entity_id: vacuum.xiaomi_vacuum_cleaner
      to: "cleaning"
  condition:
    - condition: state
      entity_id: input_boolean.automatic_vacuum_cleaner
      state: "on"
  action:
    - action: input_boolean.turn_off
      entity_id: input_boolean.automatic_vacuum_cleaner
