- id: notify_external_ip_change
  alias: Notify when the external IP changes
  trigger:
    - trigger: state
      entity_id: sensor.external_ip_address
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown
  action:
    - action: telegram_bot.send_message
      data:
        title: "🌐 *External IP*"
        message: >
          The external IP changed from {{ trigger.from_state.state }}
          to {{ trigger.to_state.state }}
