- id: turn_small_office_on_with_button
  alias: "Turn the small office on with the button"
  # The SNZB-01P (Small Office Button) has no event entity in ZHA, it only
  # fires zha_event. A short press sends 'toggle' (double press 'on', long 'off').
  #
  # The button flips a virtual switch rather than switch.small_office: that
  # switch feeds devices that should stay powered. Everything the button is
  # meant to control hangs off input_boolean.small_office_active instead.
  trigger:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "e4:56:ac:ff:fe:5a:38:9b"
        command: toggle
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.small_office_active

- id: turn_small_office_off_with_button
  alias: "Turn the small office off with the button"
  trigger:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "e4:56:ac:ff:fe:5a:38:9b"
        command: "on"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.small_office_active
