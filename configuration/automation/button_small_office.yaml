- id: turn_small_office_on_with_button
  alias: "Turn the small office on with the button"
  # The SNZB-01P (Small Office Button) has no event entity in ZHA, it only
  # fires zha_event. A short press sends 'toggle' (double press 'on', long 'off').
  trigger:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "e4:56:ac:ff:fe:5a:38:9b"
        command: toggle
  action:
    # The Nest Hub hangs off this switch, casting is picked up by
    # office_dashboard.yaml once the hub has booted.
    - action: switch.turn_on
      target:
        entity_id: switch.small_office

- id: turn_small_office_off_with_button
  alias: "Turn the small office off with the button"
  trigger:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "e4:56:ac:ff:fe:5a:38:9b"
        command: "on"
  action:
    # Stop casting straight away, so the Nest Hub is not left showing the
    # dashboard for another ten seconds before it loses power.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.cast_office_dashboard
    - delay: 00:00:10
    - action: switch.turn_off
      target:
        entity_id: switch.small_office
