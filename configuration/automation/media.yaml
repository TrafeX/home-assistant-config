- id: dim_lights_tv_on
  alias: "Dim lights when TV is on"
  trigger:
    - trigger: state
      entity_id: media_player.chromekamer
      to: "playing"
    - trigger: state
      entity_id: media_player.sony_bravia_tv
      to: "on"
  condition:
    - condition: state
      entity_id: media_player.sony_bravia_tv
      state: "on"
    - condition: numeric_state
      entity_id: light.living_spots
      attribute: brightness
      above: 50
    - condition: time
      after: "20:00:00"
  action:
    action: scene.turn_on
    entity_id: scene.living_movie

- id: restore_lights_media_paused
  alias: "Restore lights when media is paused or off"
  # Counterpart of dim_lights_tv_on: once the Chromecast has been paused or
  # off for a while nobody is watching any more, so undo the movie scene.
  # The 10 minutes keep a toilet break or an ad break from lifting the lights.
  trigger:
    - trigger: state
      entity_id: media_player.chromekamer
      to:
        - paused
        - idle
        - "off"
      for:
        minutes: 10
  condition:
    - condition: state
      entity_id: input_select.home_mode
      state: home
    - alias: Living lights are on
      condition: state
      entity_id: light.living_spots
      state: "on"
    - alias: Living lights are still dimmed for the movie scene
      condition: numeric_state
      entity_id: light.living_spots
      attribute: brightness
      below: 50
  action:
    - alias: Turn on living normal scene
      action: scene.turn_on
      target:
        entity_id: scene.living_normal

- id: turn_off_tv_leaving_sleeping
  alias: "Turn off TV when leaving or sleeping"
  trigger:
    - trigger: state
      entity_id: input_select.home_mode
      to:
        - away
        - night
  condition:
    - condition: state
      entity_id: media_player.sony_bravia_tv
      state: "on"
  action:
    - action: media_player.turn_off
      entity_id: media_player.sony_bravia_tv

- id: set_tv_speaker_volume_playstation
  alias: "Set TV speaker volume when switching to the PlayStation (HDMI 2)"
  trigger:
    - trigger: state
      entity_id: media_player.sony_bravia_tv
      attribute: source
      to: "HDMI 2/MHL"
  action:
    - alias: Set the TV speaker to 14%
      action: media_player.volume_set
      target:
        entity_id: media_player.tv_speaker
      data:
        volume_level: 0.14
