- id: notify_doorbell_press
  alias: "Notify when pressing the doorbell"
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.doorbell_visitor
      to: "on"
  action:
    - parallel:
        - action: notify.apps
          data:
            title: "Deurbel"
            message: "Er is aangebeld bij de voordeur om {{ now().strftime('%H:%M') }}."
            data:
              image: "/api/camera_proxy/camera.doorbell_sub"
              clickAction: "entityId:camera.doorbell_sub"
              ttl: 0
              vibrationPattern: "50, 200, 50, 500, 50"
              priority: high
              importance: high
              channel: Doorbell
              notification_icon: mdi:doorbell
        # Live image: the Hub fetches it once the receiver is ready, so it is
        # always current. Do not add a query string, that disables the URL
        # signing of Home Assistant and the Hub gets a 401.
        - action: media_player.play_media
          data:
            media:
              media_content_id: /api/camera_proxy/camera.doorbell_sub
              media_content_type: image/jpeg
            extra:
              title: Deurbel
          target:
            entity_id:
              - media_player.woonkamer_hub
              - media_player.werkkamer
        # Archive copy for camera.doorbell ("Last doorbell press"), off the
        # critical path.
        - action: camera.snapshot
          continue_on_error: true
          data:
            entity_id: camera.doorbell_sub
            filename: !secret frontyard_snapshot_folder
    - delay:
        minutes: 2
    - action: media_player.media_stop
      continue_on_error: true
      target:
        entity_id:
          - media_player.woonkamer_hub
          - media_player.werkkamer
