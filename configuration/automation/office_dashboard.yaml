- id: cast_office_dashboard_on_toggle
  alias: "Cast office dashboard when toggle turns on"
  trigger:
    - trigger: state
      entity_id: input_boolean.cast_office_dashboard
      to: "on"
  action:
    - action: script.cast_dashboard_office

- id: cast_office_dashboard_watchdog
  alias: "Office dashboard watchdog — re-cast if not showing"
  trigger:
    - trigger: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: input_boolean.cast_office_dashboard
      state: "on"
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.werkkamer
          state: playing
  action:
    - action: script.cast_dashboard_office

- id: cast_office_dashboard_off_toggle
  alias: "Stop casting office dashboard when toggle turns off"
  trigger:
    - trigger: state
      entity_id: input_boolean.cast_office_dashboard
      to: "off"
  action:
    - action: media_player.turn_off
      target:
        entity_id: media_player.werkkamer

- id: cast_office_dashboard_when_small_office_active
  alias: "Cast office dashboard when the small office becomes active"
  trigger:
    - trigger: state
      entity_id: input_boolean.small_office_active
      to: "on"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.cast_office_dashboard

- id: stop_casting_office_dashboard_when_small_office_inactive
  alias: "Stop casting office dashboard when the small office becomes inactive"
  # The off toggle above switches the Nest Hub off, so the watchdog stops
  # re-casting to a screen nobody is looking at.
  trigger:
    - trigger: state
      entity_id: input_boolean.small_office_active
      to: "off"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.cast_office_dashboard
