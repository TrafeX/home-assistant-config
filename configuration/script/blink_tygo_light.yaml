alias: 'Blink light'
fields:
  entity_id:
    description: 'The light entity to blink'
    example: 'light.bedroom_tygo'
    required: true
    selector:
      entity:
        domain: light
sequence:
  - service: zwave_js.invoke_cc_api
    data:
      command_class: "113"
      method_name: sendReport
      parameters:
        - alarmType: 0
          alarmLevel: 255
    target:
      entity_id: "{{ entity_id }}"
  - delay: '00:00:15'
  - service: zwave_js.invoke_cc_api
    data:
      command_class: "113"
      method_name: sendReport
      parameters:
        - alarmType: 0
          alarmLevel: 0
    target:
      entity_id: "{{ entity_id }}"
